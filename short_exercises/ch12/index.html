<!DOCTYPE HTML>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete a Form</title>
	<link rel="stylesheet" href="styles/main.css">
</head>

<body>
<h1>Please complete our survey</h1>
<form action="confirmation.html" method="get">

    <fieldset class="validate">
        <legend>Contact information</legend>
        <label for="email"><span class="key">E</span>mail address:</label>
        <input type="email" id="email" name="email" accesskey="e" autocomplete="email" required autofocus>

        <label for="first_name"><span class="key">F</span>irst name:</label>
        <input type="text" id="first_name" name="first_name" accesskey="f" autocomplete="given-name" required>

        <label for="last_name"><span class="key">L</span>ast name:</label>
        <input type="text" id="last_name" name="last_name" accesskey="l" autocomplete="family-name" required>
    </fieldset>

    <fieldset class="validate">
        <legend>Geographic information</legend>
        <label for="state"><span class="key">S</span>tate:</label>
        <input type="text" id="state" name="state" accesskey="s" maxlength="2"
               pattern="[A-Za-z]{2}" title="Two-letter state abbreviation, like CA"
               placeholder="Two characters" required>

        <label for="zip"><span class="key">Z</span>ip code:</label>
        <input type="text" id="zip" name="zip" accesskey="z" maxlength="5"
               pattern="[0-9]{5}" title="Five-digit zip code" inputmode="numeric"
               placeholder="Five digits" required>
    </fieldset>

    <fieldset>
        <legend>Source</legend>
        <label for="source">How did you hear about us?</label>
        <select id="source" name="source">
            <option value="web" selected>Web Search</option>
            <option value="social">Social Media</option>
            <option value="friend">Friend or Family</option>
            <option value="ad">Advertisement</option>
            <option value="other">Other</option>
        </select>

        <label for="comments">Additional comments:</label>
        <textarea id="comments" name="comments" rows="6"
                  placeholder="Add any additional comments here."></textarea>
    </fieldset>

    <input type="submit" value="Submit" class="button submit">
    <input type="reset" value="Reset" class="button reset">
</form>
</body>
</html>
